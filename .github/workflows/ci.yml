name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Windows unit tests and release bundle check
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Run Windows unit, installer, REPL runner, and release bundle tests
        env:
          CI: '1'
        run: python -m unittest discover -s tests -v

      - name: Build and verify deterministic slim release ZIP
        run: |
          python tools/build_release_zip.py --version v0.3.0 --out dist
          Get-Content dist/SHA256SUMS.txt
